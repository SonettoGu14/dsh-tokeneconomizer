# dsh-te: the install-all bundle. Installing this package pulls the three
# components and inserts their rows; set `enabled: false` on a row's config to
# keep the component dormant without uninstalling it.
#
# Install: dsh plugin --profile <name> add link:<repo>/packages/bundle
# Then add "dsh-te" to dsh.profile.bundles in that profile's package.json.
- insert:
    - id: te-cost
      name: 'dsh-te-cost'
      config:
        enabled: true
    - id: te-facts
      name: 'dsh-te-facts'
      config:
        enabled: true
    - id: te-prune
      name: 'dsh-te-prune'
      config:
        enabled: false
